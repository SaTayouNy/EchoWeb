spring:
  datasource:
    url: "jdbc:h2:file:./data/echo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE"
    username: "sa"
    password: "sa"
    driver-class-name: "org.h2.Driver"
  jpa:
    hibernate:
      ddl-auto: "update"
  h2:
    console:
      enabled: true
      path: "/h2-console"

app:
  auth:
    token:
      secret: "${APP_AUTH_TOKEN_SECRET:dev-token-secret-change-me-1234567890}"
  email:
    provider: "${APP_EMAIL_PROVIDER:in-memory}"
    from: "${APP_EMAIL_FROM:no-reply@echo.local}"
    verification-url-template: "${APP_EMAIL_VERIFICATION_URL_TEMPLATE:http://localhost:5173/verify-email?token=%s}"
    password-recovery-url-template: "${APP_EMAIL_PASSWORD_RECOVERY_URL_TEMPLATE:http://localhost:5173/reset-password?token=%s}"
  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}"
